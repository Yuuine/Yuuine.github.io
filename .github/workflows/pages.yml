name: Pages

# 只在 main 分支触发。重构分支（refactor/*）不会碰线上。
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Next.js 16 要求 Node >= 20.9；这里用 22 LTS（Node 20 已于 2026-04 EOL）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 用 ci 而不是 install：严格按 package-lock.json 安装，保证和本地一致
      - name: Install dependencies
        run: npm ci

      # next build + output: 'export' → 产物在 out/
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
